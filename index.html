<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>하루 다섯 사자성어</title>
  <meta name="description" content="초등학생을 위한 하루 5개 사자성어 카드 학습" />
  <meta name="theme-color" content="#ffb84d" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-icon">📚</span>
      <div>
        <h1>하루 다섯 사자성어</h1>
        <p id="dayLabel" class="day-label"></p>
      </div>
    </div>
    <div class="stars" title="모은 별"><span>⭐</span><b id="starCount">0</b></div>
  </header>

  <main id="app" aria-live="polite"></main>

  <nav class="tabs" role="tablist">
    <button class="tab" data-view="today" role="tab"><span>📖</span>오늘 공부</button>
    <button class="tab" data-view="review" role="tab"><span>🔁</span>복습</button>
    <button class="tab" data-view="stamps" role="tab"><span>🏅</span>도장판</button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <button class="modal-close" aria-label="닫기">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
